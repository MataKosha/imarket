<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: http:; connect-src https://docs.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>iMarket Store — Купить iPhone, MacBook, iPad, Apple Watch · Астана, Орал, Атырау</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f7;
  --card:#ffffff;
  --ink:#1d1d1f;
  --mut:#6e6e73;
  --blue:#0071e3;
  --blue-h:#0077ed;
  --wa:#1fb35a;
  --line:rgba(0,0,0,.08);
  --shadow:0 4px 20px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.03);
  --shadow-h:0 18px 40px rgba(0,0,0,.1);
  --r:24px;
  --pad:max(20px, calc((100vw - 1180px) / 2));
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.38;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
::selection{background:var(--blue);color:#fff}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}

/* Apple Global Nav */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(245,245,247,.86);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.nav-bar{height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.apple-logo{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.apple-logo svg{width:16px;height:19px;fill:currentColor;margin-top:-2px}
.nav-links{display:none;align-items:center;gap:24px;font-size:12px;color:rgba(29,29,31,.82);font-weight:400}
.nav-links a:hover,.nav-links button:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:8px}
.city-pill{
  height:30px;padding:0 11px;border-radius:999px;
  background:rgba(0,0,0,.055);border:0;
  font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;
}
.lang-pill{display:inline-flex;background:rgba(0,0,0,.055);border-radius:999px;padding:2px}
.lang-pill button{height:26px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;color:var(--mut)}
.lang-pill button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.nav-ico:hover{background:rgba(0,0,0,.055)}

/* Apple Store Ribbon */
.ribbon{
  background:#fff;border-bottom:1px solid rgba(0,0,0,.05);
  padding:11px 16px;text-align:center;font-size:13px;color:var(--ink);
}
.ribbon a{color:var(--blue);font-weight:500;margin-left:4px}
.ribbon a:hover{text-decoration:underline}

/* Store Hero Header */
.store-hero{padding:44px 0 24px}
.hero-row{display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.store-h1{
  font-size:clamp(34px,5.4vw,52px);
  font-weight:600;
  letter-spacing:-.035em;
  line-height:1.08;
  max-width:740px;
}
.store-h1 span{color:var(--mut)}
.specialist{display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.spec-item{display:flex;align-items:center;gap:12px;font-size:13px}
.spec-av{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#1d1d1f,#48484c);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0;
}
.spec-item b{display:block;font-weight:600;color:var(--ink)}
.spec-item a{color:var(--blue);font-weight:500}
.spec-item a:hover{text-decoration:underline}

/* Product Lineup Shelf */
.lineup{
  display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;
  padding:8px var(--pad) 24px;
}
.lineup::-webkit-scrollbar{display:none}
.lu-item{
  flex:0 0 118px;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:12px 8px;border-radius:18px;text-align:center;
  transition:transform .25s cubic-bezier(.16,1,.3,1),background .2s;
}
.lu-item:hover{transform:translateY(-3px);background:rgba(255,255,255,.7)}
.lu-thumb{width:96px;height:66px;display:grid;place-items:center}
.lu-thumb img{max-height:64px;width:auto;object-fit:contain;mix-blend-mode:multiply}
.lu-item span{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}

/* Shelf Sections */
.shelf-sec{padding:24px 0 36px}
.shelf-hd{
  padding:0 var(--pad);
  margin-bottom:20px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.shelf-title{
  font-size:clamp(24px,3.2vw,30px);
  font-weight:600;
  letter-spacing:-.028em;
  line-height:1.15;
}
.shelf-title span{color:var(--mut)}
.shelf-link{font-size:14px;font-weight:500;color:var(--blue);white-space:nowrap}
.shelf-link:hover{text-decoration:underline}

/* Horizontal Card Carousel (Новинки) */
.rail{
  display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;
  scroll-snap-type:x mandatory;
  scroll-padding-left:var(--pad);
  padding:8px var(--pad) 24px;
}
.rail::-webkit-scrollbar{display:none}

/* Store Showcase Card (Новинки) */
.scard{
  flex:0 0 320px;
  scroll-snap-align:start;
  background:var(--card);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:26px 24px 24px;
  display:flex;flex-direction:column;justify-content:space-between;
  min-height:470px;
  transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s cubic-bezier(.16,1,.3,1);
}
.scard.dark{background:#000;color:#f5f5f7}
.scard.dark .scard-sub,.scard.dark .scard-inst{color:#a1a1a6}
.scard.dark .pw{background:transparent}
@media(hover:hover){
  .scard:hover{transform:scale(1.014);box-shadow:var(--shadow-h)}
}
.scard-kicker{
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:#bf4800;margin-bottom:6px;min-height:15px;
}
.scard.dark .scard-kicker{color:#f56300}
.scard-title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.14}
.scard-sub{font-size:13px;color:var(--mut);margin-top:4px}
.scard-media{margin:14px 0;display:grid;place-items:center;height:210px}
.pw{width:100%;height:100%;display:grid;place-items:center;overflow:hidden;border-radius:16px}
.pw .pimgx{max-height:198px;width:auto;max-width:100%;object-fit:contain;mix-blend-mode:multiply;transition:opacity .2s ease}
.scard.dark .pw .pimgx{mix-blend-mode:normal}

/* Swatches */
.swatches{display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px;margin:4px 0 10px}
.sw{
  width:15px;height:15px;border-radius:50%;
  border:1px solid rgba(0,0,0,.22);
  position:relative;transition:transform .15s;
}
.sw.on::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--blue);
}
.scard.dark .sw.on::after{border-color:#fff}

/* Memory pills */
.card-mems{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.cmem{
  height:26px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:500;color:var(--mut);
  background:rgba(0,0,0,.045);transition:all .15s;
}
.cmem.on{background:var(--ink);color:#fff;font-weight:600}
.scard.dark .cmem{background:rgba(255,255,255,.12);color:#d2d2d7}
.scard.dark .cmem.on{background:#fff;color:#000}

.scard-foot{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding-top:12px;border-top:1px solid rgba(0,0,0,.06);
}
.scard.dark .scard-foot{border-top-color:rgba(255,255,255,.12)}
.scard-price{font-size:15px;font-weight:600;letter-spacing:-.01em}
.scard-inst{font-size:11px;color:var(--mut);margin-top:2px}
.buy-pill{
  height:36px;padding:0 16px;border-radius:999px;
  background:var(--blue);color:#fff;
  font-size:13px;font-weight:500;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s,transform .15s;
}
.buy-pill:hover{background:var(--blue-h)}
.buy-pill:active{transform:scale(.96)}

/* =========================================================
   УДОБНЫЙ КАТАЛОГ (Полноценная сетка с быстрыми фильтрами)
   ========================================================= */
.cat-sec{
  padding:44px 0 48px;
  background:#fff;
  border-block:1px solid rgba(0,0,0,.06);
}
.cat-top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:22px;
}
.cat-tabs{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:4px;margin-bottom:16px;
}
.cat-tabs::-webkit-scrollbar{display:none}
.ctab{
  flex:0 0 auto;height:40px;padding:0 18px;border-radius:999px;
  background:#f5f5f7;color:var(--ink);
  font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;gap:8px;
  transition:all .15s;
}
.ctab:hover{background:#ebebef}
.ctab.on{background:var(--ink);color:#fff;font-weight:600}

.cat-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border-radius:18px;background:#f5f5f7;
  margin-bottom:24px;
}
.cat-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(0,0,0,.06);border-radius:999px;padding:3px}
.seg button{
  height:30px;padding:0 13px;border-radius:999px;
  font-size:12px;font-weight:500;color:var(--mut);transition:all .15s;
}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sort-pill{
  height:36px;padding:0 14px;border-radius:999px;
  background:#fff;border:1px solid rgba(0,0,0,.08);
  font-size:12px;font-weight:500;color:var(--ink);
  transition:all .15s;
}
.sort-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search-box{position:relative;flex:1 1 220px;max-width:300px}
.search-in{
  width:100%;height:36px;border-radius:999px;
  background:#fff;border:1px solid rgba(0,0,0,.1);
  padding:0 14px;font-size:13px;outline:none;
}
.search-in:focus{border-color:var(--blue)}

/* Сетка карточек каталога */
.cat-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}
.gcard{
  background:#f5f5f7;
  border-radius:22px;
  padding:20px 18px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s,background .2s;
}
@media(hover:hover){
  .gcard:hover{
    background:#fff;
    transform:translateY(-4px);
    box-shadow:0 14px 34px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.06);
  }
}
.gcard-vis{
  height:185px;display:grid;place-items:center;
  background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;
}
.gcard-vis .pw{height:160px;background:transparent}
.gcard-vis .pw .pimgx{max-height:155px}
.gcard-name{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.gcard-spec{font-size:12px;color:var(--mut);margin-top:3px}

/* Цвет с подписью в каталоге */
.gcard-col-row{margin-top:10px}
.gcard-col-lbl{font-size:11px;color:var(--mut);margin-bottom:6px;display:block}
.gcard-col-lbl b{color:var(--ink);font-weight:600}
.gcard-swatches{display:flex;gap:7px;flex-wrap:wrap}

/* Память в ряд в каталоге */
.gcard-mems{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;
  margin-top:12px;
}
.gmem{
  height:30px;padding:0 4px;border-radius:9px;
  background:#fff;border:1px solid rgba(0,0,0,.08);
  font-size:11px;font-weight:500;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:all .15s;
}
.gmem.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}

.gcard-foot{
  margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.07);
}
.gcard-price{font-size:18px;font-weight:600;letter-spacing:-.02em}
.gcard-price.q{font-size:13px;color:#b26a00}
.gcard-inst{font-size:11px;color:var(--mut);margin-top:2px;min-height:15px}
.gcard-actions{
  display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px;
}
.gcard-buy{
  height:38px;padding:0 14px;border-radius:999px;
  background:var(--blue);color:#fff;
  font-size:13px;font-weight:500;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.gcard-buy:hover{background:var(--blue-h)}
.gcard-more{
  height:38px;padding:0 12px;border-radius:999px;
  background:#fff;border:1px solid rgba(0,0,0,.1);
  font-size:12px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.gcard-more:hover{background:#ebebef}

.cat-empty{
  display:none;text-align:center;padding:36px 20px;
  background:#f5f5f7;border-radius:22px;margin-top:12px;
}

/* Apple Difference Cards */
.diff-card{
  flex:0 0 280px;scroll-snap-align:start;
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:26px 24px;display:flex;flex-direction:column;justify-content:space-between;
  min-height:215px;
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;
}
@media(hover:hover){.diff-card:hover{transform:scale(1.015);box-shadow:var(--shadow-h)}}
.diff-ico{font-size:30px;line-height:1;margin-bottom:14px}
.diff-card h3{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.22}
.diff-card h3 span{color:var(--blue)}
.diff-card p{font-size:13px;color:var(--mut);margin-top:8px}

/* Interactive Bento Grid (Compare, Kaspi 0-0-12, Trade-In, Branches) */
.bento{display:grid;gap:20px;margin-top:8px}
.bcard{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:28px 24px;
}
.bcard h3{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.bcard .sub{font-size:14px;color:var(--mut);margin-bottom:18px}

.apple-select,.apple-input{
  width:100%;height:46px;border-radius:12px;
  background:#f5f5f7;border:1px solid rgba(0,0,0,.1);
  padding:0 14px;font-size:15px;color:var(--ink);outline:none;
}
.apple-select:focus,.apple-input:focus{background:#fff;border-color:var(--blue)}

/* Compare table inside bento */
.cmp-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cmp-vis{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin-bottom:14px}
.cmp-vis .pw{height:130px;background:#f5f5f7;border-radius:16px}
.cmp-vis .pw .pimgx{max-height:115px}
.cmp-vis b{display:block;font-size:14px;margin-top:8px}
.cmp-rows{border-top:1px solid var(--line)}
.cmp-r{display:grid;grid-template-columns:1fr 1fr;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.cmp-r span{grid-column:1/-1;font-size:11px;color:var(--mut);margin-bottom:2px}
.cmp-r b{font-weight:600}
.cmp-r b.win{color:var(--blue)}

/* Calculator & Trade-In */
.lbl{display:block;font-size:12px;font-weight:500;color:var(--mut);margin:12px 0 6px}
.mo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo-btn{
  height:40px;border-radius:12px;background:#f5f5f7;border:1px solid rgba(0,0,0,.08);
  font-size:14px;font-weight:600;color:var(--mut);
}
.mo-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.val-box{
  margin-top:16px;padding:16px;border-radius:16px;background:#f5f5f7;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.val-box span{font-size:13px;color:var(--mut)}
.val-box b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.primary-btn{
  width:100%;height:46px;margin-top:14px;border-radius:999px;
  background:var(--blue);color:#fff;font-size:15px;font-weight:500;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.primary-btn:hover{background:var(--blue-h)}

/* Branches */
.br-grid{display:grid;gap:16px}
.br-card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:24px;border:1.5px solid transparent;transition:border-color .2s;
}
.br-card.on{border-color:var(--blue)}
.br-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.br-top b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.br-badge{font-size:11px;font-weight:600;color:var(--blue);background:rgba(0,113,227,.1);padding:4px 10px;border-radius:999px}
.br-addr{font-size:14px;color:var(--mut);margin-top:8px}
.br-hrs{font-size:13px;color:var(--mut);margin-top:4px}
.br-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.br-btn{
  height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;
  background:#f5f5f7;color:var(--ink);
}
.br-btn.act{background:var(--ink);color:#fff}
.br-btn.wa{background:var(--wa);color:#fff}

/* Quick Links Footer Pills */
.qlinks{padding:24px 0 36px}
.qlinks h3{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-bottom:16px}
.qpills{display:flex;flex-wrap:wrap;gap:10px}
.qpill{
  height:40px;padding:0 18px;border-radius:999px;
  border:1px solid var(--ink);font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,color .15s;
}
.qpill:hover{background:var(--ink);color:#fff}

footer{
  border-top:1px solid rgba(0,0,0,.08);
  padding:28px 0 44px;font-size:12px;color:var(--mut);
}
.foot-note{max-width:860px;line-height:1.5;margin-bottom:16px}
.foot-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-top:16px;border-top:1px solid rgba(0,0,0,.06)}
.foot-bar a{color:var(--blue)}

/* Apple Buy / Configure Modal */
dialog{
  margin:auto;width:min(760px,calc(100% - 24px));max-height:90dvh;overflow:auto;
  border:0;border-radius:28px;background:#fff;color:var(--ink);padding:0;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.dlg-body{display:grid;gap:24px;padding:28px}
.dlg-close{
  position:sticky;top:14px;float:right;margin:14px 14px 0 0;z-index:5;
  width:32px;height:32px;border-radius:50%;background:#e8e8ed;color:var(--mut);
  display:grid;place-items:center;font-size:16px;font-weight:600;
}
.dlg-vis{background:#f5f5f7;border-radius:20px;padding:20px;display:grid;place-items:center;min-height:260px}
.dlg-vis .pw{height:230px}
.dlg-vis .pw .pimgx{max-height:220px}

const pic = (p, eager = false) => {
  const sList = srcs(p);
  return `<span class="pw"><img class="pimgx" ${eager ? '' : 'loading="lazy"'} src="${sList[0]}" alt="${p.n}" onerror="fb(this,'${p.id}')"></span>`;
};

function fb(el, id) {
  const p = [...P, ...DEV, ...ACC].find(x => x.id === id);
  const n = (+el.dataset.n || 0) + 1;
  const l = srcs(p);
  if (n < l.length) { el.dataset.n = n; el.src = l[n]; return; }
  const w = el.closest('.pw');
  if (w) w.innerHTML = p && p.g === 'watch'
    ? `<svg class="ph watch" viewBox="0 0 80 120"><rect x="24" y="2" width="32" height="22" rx="6" fill="#d1d1d6"/><rect x="24" y="96" width="32" height="22" rx="6" fill="#d1d1d6"/><rect x="14" y="22" width="52" height="76" rx="16" fill="#2b2d32"/></svg>`
    : `<svg class="ph" viewBox="0 0 70 140"><rect x="3" y="2" width="64" height="136" rx="14" fill="#2b2d32"/></svg>`;
}

const price = (p, i) => {
  const v = p.o[i][(F.esim && (p.g === 'base' || p.g === 'pro')) ? 2 : 1];
  return v > 0 ? v + ADJ : v;
};
const pTxt = (p, i) => {
  const v = price(p, i);
  return v > 0 ? fmt(v) : v === -1 ? t('soonP') : t('onreq');
};
const iTxt = (p, i) => price(p, i) > 0 ? t('from') + fmt(Math.round(price(p, i) / 12)) + t('mo') : '';
const colName = ck => { const c = CL[ck]; return c ? (L === 'kk' ? c[1] : c[0]) : ''; };
const colHex = ck => CL[ck] ? CL[ck][2] : '#ccc';

function renderSwatches(p) {
  if (!p.cols || p.cols.length <= 1) return '<div class="swatches"></div>';
  const curIdx = selCol[p.id] || 0;
  return `<div class="swatches">${p.cols.map((ck, idx) =>
    `<button type="button" class="sw${idx === curIdx ? ' on' : ''}" style="background:${colHex(ck)}" title="${colName(ck)}" aria-label="${colName(ck)}" data-colp="${p.id}" data-coli="${idx}"></button>`
  ).join('')}</div>`;
}

/* 1. Рендер витрины НОВИНОК */
function renderLatest() {
  const latest = P.filter(p => p.featured);
  $('latestRail').innerHTML = latest.map(p => {
    const i = sel[p.id] || 0;
    return `<article class="scard${p.dark ? ' dark' : ''}">
      <div>
        <div class="scard-kicker">${p.kicker || 'PRO'}</div>
        <h3 class="scard-title">${p.n}</h3>
        <div class="scard-sub">${p.disp}" · ${p.chip}</div>
      </div>
      <div class="scard-media" id="limg-${p.id}">${pic(p, true)}</div>
      <div>
        ${renderSwatches(p)}
        <div class="card-mems">${p.o.map((o, idx) =>
          `<button type="button" class="cmem${idx === i ? ' on' : ''}" data-p="${p.id}" data-i="${idx}">${o[0]}</button>`
        ).join('')}</div>
        <div class="scard-foot">
          <div>
            <div class="scard-price" id="lpr-${p.id}">${pTxt(p, i)}</div>
            <div class="scard-inst" id="lin-${p.id}">${iTxt(p, i)}</div>
          </div>
          <button type="button" class="buy-pill" data-open="${p.id}">${t('buy')}</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* 2. Рендер ПОЛНОГО КАТАЛОГА */
function renderGrid() {
  $('iphoneFilters').style.display = F.dev === 'iphone' ? 'flex' : 'none';
  document.querySelectorAll('#catTabs .ctab').forEach(b => b.classList.toggle('on', b.dataset.dev === F.dev));

  if (F.dev === 'acc') {
    $('empty').style.display = 'none';
    $('grid').innerHTML = ACC.map(a => {
      const v = a.o[0][1];
      return `<article class="gcard">
        <div>
          <div class="gcard-vis" id="pimg-${a.id}">${pic(a)}</div>
          <h3 class="gcard-name">${t(a.nk)}</h3>
          <div class="gcard-spec">${t(a.dk)}</div>
        </div>
        <div class="gcard-foot">
          <div class="gcard-price${v > 0 ? '' : ' q'}">${v > 0 ? fmt(v + ADJ) : t('onreq')}</div>
          <div class="gcard-actions" style="grid-template-columns:1fr">
            <button type="button" class="gcard-buy" data-acc="${a.id}">${t('buy')}</button>
          </div>
        </div>
      </article>`;
    }).join('');
    return;
  }

  const pool = F.dev === 'iphone' ? P : DEV.filter(x => x.g === F.dev);
  let list = pool.filter(p => (F.dev !== 'iphone' || F.cat === 'all' || p.g === F.cat) && p.n.toLowerCase().includes(F.q));
  if (F.asc) list = [...list].sort((a, b) => (price(a, 0) > 0 ? price(a, 0) : 1e12) - (price(b, 0) > 0 ? price(b, 0) : 1e12));

  $('empty').style.display = list.length ? 'none' : 'block';

  $('grid').innerHTML = list.map(p => {
    const i = sel[p.id] || 0;
    const cIdx = selCol[p.id] || 0;
    const hasCols = p.cols && p.cols.length > 0;
    const isWatch = p.g === 'watch';
    return `<article class="gcard">
      <div>
        <div class="gcard-vis" id="pimg-${p.id}">${pic(p)}</div>
        <h3 class="gcard-name">${p.n}</h3>
        <div class="gcard-spec">${p.d || p.disp + '" · ' + p.chip}</div>

        <div class="gcard-mems">${p.o.map((o, idx) =>
          `<button type="button" class="gmem${idx === i ? ' on' : ''}" data-p="${p.id}" data-i="${idx}">${o[0]}</button>`
        ).join('')}</div>

        ${hasCols ? `
          <div class="gcard-col-row">
            <span class="gcard-col-lbl">${t('colLbl')} <b id="clbl-${p.id}">${colName(p.cols[cIdx])}</b></span>
            <div class="gcard-swatches">${p.cols.map((ck, idx) =>
              `<button type="button" class="sw${idx === cIdx ? ' on' : ''}" style="background:${colHex(ck)}" title="${colName(ck)}" aria-label="${colName(ck)}" data-colp="${p.id}" data-coli="${idx}"></button>`
            ).join('')}</div>
          </div>
        ` : ''}
      </div>

      <div class="gcard-foot">
        <div class="gcard-price${price(p, i) > 0 ? '' : ' q'}" id="pr-${p.id}">${pTxt(p, i)}</div>
        <div class="gcard-inst" id="in-${p.id}">${iTxt(p, i)}</div>
        <div class="gcard-actions"${!p.disp ? ' style="grid-template-columns:1fr"' : ''}>
          <button type="button" class="gcard-buy" ${isWatch ? `data-watch="${p.id}"` : `data-order="${p.id}"`}>${t('buy')}</button>
          ${p.disp ? `<button type="button" class="gcard-more" data-open="${p.id}">${t('more')}</button>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');
}

function specs(p) {
  return [
    [t('spDisp'), p.disp + '"', p.disp],
    [t('spChip'), p.chip],
    [t('spCam'), p.cam],
    [t('spHz'), p.hz + ' Hz', p.hz],
    [t('spMat'), t(p.mat)],
    [t('spBat'), p.bat ? p.bat.toLocaleString('ru-RU').replace(/\u00a0/g, ' ') + ' mAh' : '—', p.bat || 0],
    [t('spMem'), p.o.map(o => o[0]).join(' / ')],
    [t('spPrice'), pTxt(p, 0)]
  ];
}

function renderCmp() {
  const a = P.find(x => x.id === $('cA').value) || P[0];
  const b = P.find(x => x.id === $('cB').value) || P[1];
  $('cmpHead').innerHTML = [a, b].map(p => `<div>${pic(p, true)}<b>${p.n}</b></div>`).join('');
  const sa = specs(a), sb = specs(b);
  $('cmpTbl').innerHTML = sa.map((r, i) => {
    const x = sb[i], w = r[2] !== undefined && r[2] !== x[2];
    return `<div class="cmp-r"><span>${r[0]}</span><b class="${w && r[2] > x[2] ? 'win' : ''}">${r[1]}</b><b class="${w && x[2] > r[2] ? 'win' : ''}">${x[1]}</b></div>`;
  }).join('');
}

function orderMsg(p) {
  const o = p.o[sel[p.id] || 0];
  const v = price(p, sel[p.id] || 0);
  const chosenCol = p.cols && p.cols.length ? ' (' + colName(p.cols[selCol[p.id] || 0]) + ')' : '';
  const sim = (p.g === 'base' || p.g === 'pro') ? ' ' + (F.esim ? 'eSIM' : 'SIM') : '';
  return `iMarket (${t(CITY)}): ${p.n} ${o[0]}${chosenCol}${sim}${v > 0 ? ' — ' + fmt(v) : ''}`;
}

function syncProductUI(pid) {
  const p = [...P, ...DEV, ...ACC].find(x => x.id === pid);
  if (!p) return;
  const i = sel[pid] || 0;
  const cIdx = selCol[pid] || 0;

  const lBox = $('limg-' + pid);
  if (lBox) lBox.innerHTML = pic(p, true);
  const gBox = $('pimg-' + pid);
  if (gBox) gBox.innerHTML = pic(p, true);

  document.querySelectorAll(`.sw[data-colp="${pid}"]`).forEach(b => {
    b.classList.toggle('on', +b.dataset.coli === cIdx);
  });
  const clbl = $('clbl-' + pid);
  if (clbl && p.cols && p.cols[cIdx]) clbl.textContent = colName(p.cols[cIdx]);

  document.querySelectorAll(`[data-p="${pid}"]`).forEach(b => {
    b.classList.toggle('on', +b.dataset.i === i);
  });

  if ($('lpr-' + pid)) $('lpr-' + pid).textContent = pTxt(p, i);
  if ($('lin-' + pid)) $('lin-' + pid).textContent = iTxt(p, i);
  if ($('pr-' + pid)) {
    $('pr-' + pid).textContent = pTxt(p, i);
    $('pr-' + pid).classList.toggle('q', !(price(p, i) > 0));
  }
  if ($('in-' + pid)) $('in-' + pid).textContent = iTxt(p, i);

  if (pid === $('cA').value || pid === $('cB').value) renderCmp();
}

function openBuyModal(id) {
  const p = [...P, ...DEV].find(x => x.id === id);
  if (!p) return;
  const curC = selCol[p.id] || 0;
  const curM = sel[p.id] || 0;
  const isPhone = p.g === 'base' || p.g === 'pro';

  $('dlg').innerHTML = `
    <button type="button" class="dlg-close" id="dlgClose" aria-label="Close">✕</button>
    <div class="dlg-body">
      <div class="dlg-vis" id="dlg-vis-${p.id}">${pic(p, true)}</div>
      <div>
        <div class="dlg-kicker">${p.kicker || 'APPLE'}</div>
        <h3 class="dlg-title">${p.n}</h3>
        <div style="font-size:13px;color:var(--mut);margin-top:2px">${p.d || p.disp + '" · ' + p.chip}</div>

        ${p.cols && p.cols.length ? `
          <div class="dlg-step">${t('stepCol')} <span id="dlgColName">${colName(p.cols[curC])}</span></div>
          <div class="dlg-cols">${p.cols.map((ck, idx) =>
            `<button type="button" class="dcol${idx === curC ? ' on' : ''}" data-dcol="${idx}"><i style="background:${colHex(ck)}"></i>${colName(ck)}</button>`
          ).join('')}</div>
        ` : ''}

        <div class="dlg-step">${t('stepMem')}</div>
        <div class="dlg-mems">${p.o.map((o, idx) =>
          `<button type="button" class="dmem${idx === curM ? ' on' : ''}" data-dmem="${idx}"><b>${o[0]}</b><span>${pTxt(p, idx)}</span></button>`
        ).join('')}</div>

        ${isPhone ? `
          <div class="dlg-step">${t('stepNet')}</div>
          <div class="seg" id="dlgSim">
            <button type="button" class="${!F.esim ? 'on' : ''}" data-dsim="0">SIM</button>
            <button type="button" class="${F.esim ? 'on' : ''}" data-dsim="1">eSIM</button>
          </div>
        ` : ''}

        <div class="val-box" style="margin-top:18px">
          <div>
            <span id="dlgInst">${iTxt(p, curM) || 'Kaspi 0-0-12'}</span>
            <b id="dlgPrice" style="display:block;font-size:22px">${pTxt(p, curM)}</b>
          </div>
          <button type="button" class="buy-pill" style="height:44px;padding:0 22px;font-size:14px" id="dlgOrderBtn">${t('buy')}</button>
        </div>

        ${p.disp ? `<div class="dlg-specs">${specs(p).slice(0, 6).map(r => `<div class="dsp"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>` : ''}
      </div>
    </div>
  `;

  $('dlg').showModal();
  $('dlgClose').onclick = () => $('dlg').close();

  $('dlg').querySelectorAll('[data-dcol]').forEach(btn => {
    btn.onclick = () => {
      selCol[p.id] = +btn.dataset.dcol;
      $('dlg').querySelectorAll('[data-dcol]').forEach(x => x.classList.toggle('on', x === btn));
      $('dlgColName').textContent = colName(p.cols[selCol[p.id]]);
      $('dlg-vis-' + p.id).innerHTML = pic(p, true);
      syncProductUI(p.id);
    };
  });

  $('dlg').querySelectorAll('[data-dmem]').forEach(btn => {
    btn.onclick = () => {
      sel[p.id] = +btn.dataset.dmem;
      $('dlg').querySelectorAll('[data-dmem]').forEach(x => x.classList.toggle('on', x === btn));
      $('dlgPrice').textContent = pTxt(p, sel[p.id]);
      $('dlgInst').textContent = iTxt(p, sel[p.id]) || 'Kaspi 0-0-12';
      syncProductUI(p.id);
    };
  });

  const dSim = $('dlgSim');
  if (dSim) {
    dSim.onclick = e => {
      const b = e.target.closest('[data-dsim]');
      if (!b) return;
      F.esim = +b.dataset.dsim;
      dSim.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      document.querySelectorAll('#simSeg button').forEach(x => x.classList.toggle('on', +x.dataset.sim === F.esim));
      $('dlg').querySelectorAll('[data-dmem]').forEach(x => {
        x.querySelector('span').textContent = pTxt(p, +x.dataset.dmem);
      });
      $('dlgPrice').textContent = pTxt(p, sel[p.id]);
      $('dlgInst').textContent = iTxt(p, sel[p.id]) || 'Kaspi 0-0-12';
      renderLatest();
      renderGrid();
      renderCmp();
    };
  }

  $('dlgOrderBtn').onclick = () => wa(curCity().wa, orderMsg(p));
}

function renderBr() {
  $('brList').innerHTML = Object.values(CITIES).map(b => {
    const isAct = b.k === CITY;
    const addr = L === 'kk' ? b.addrKk : b.addrRu;
    const hrs = L === 'kk' ? b.hrsKk : b.hrsRu;
    return `<div class="br-card${isAct ? ' on' : ''}">
      <div class="br-top">
        <b>${t(b.k)}</b>
        ${b.k === 'astana' ? `<span class="br-badge">${t('main')}</span>` : ''}
      </div>
      <div class="br-addr">${addr}</div>
      <div class="br-hrs">${hrs} · ${b.phoneFmt}</div>
      <div class="br-btns">
        <button type="button" class="br-btn${isAct ? ' act' : ''}" data-setcity="${b.k}">${isAct ? '✓ ' + t('selectedCity') : t('selectCity')}</button>
        <a class="br-btn wa" href="https://wa.me/${b.wa}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a class="br-btn" href="${b.mapUrl}" target="_blank" rel="noopener noreferrer">2GIS ↗</a>
      </div>
    </div>`;
  }).join('');
}

function applyCityUI() {
  const c = curCity();
  $('citySel').value = CITY;
  $('heroStoreTitle').textContent = `iMarket · ${t(CITY)}`;
  $('d5Sub').textContent = L === 'kk' ? c.delivKk : c.delivRu;
  $('hdrPhone').href = 'tel:+' + c.wa;
  $('dockPhone').href = 'tel:+' + c.wa;
  $('qlMap').href = c.mapUrl;
  document.querySelectorAll('.js-wa-link').forEach(a => a.href = 'https://wa.me/' + c.wa);
  document.querySelectorAll('.ti-only').forEach(el => { el.style.display = c.tradein ? '' : 'none'; });
}

const calcSum = () => Math.min(Math.max(parseFloat($('calcPrice').value) || 0, 0), 5e6);
function calc() { $('calcResult').textContent = fmt(Math.round(calcSum() / months)); }
function trade() {
  const v = TI[$('trM').selectedIndex][1] * parseFloat($('trB').value) * TIC[$('trC').selectedIndex];
  $('trOut').textContent = '≈ ' + fmt(Math.round(v / 5000) * 5000);
}

function applyLang() {
  document.documentElement.lang = L === 'kk' ? 'kk' : 'ru';
  document.querySelectorAll('[data-i]').forEach(e => { e.innerHTML = t(e.dataset.i); });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === L));
  const opts = $('citySel').options;
  opts[0].textContent = t('astana');
  opts[1].textContent = t('oral');
  opts[2].textContent = t('atyr');
  const keep = $('trC').selectedIndex;
  $('trC').innerHTML = t('c').map(c => `<option>${c}</option>`).join('');
  $('trC').selectedIndex = Math.max(0, keep);
  applyCityUI();
  renderBr();
  renderLatest();
  renderGrid();
  renderCmp();
  calc();
  trade();
}

function switchCity(newCity) {
  if (!CITIES[newCity]) return;
  CITY = newCity;
  try {
    localStorage.setItem('city', CITY);
    const u = new URL(location.href);
    u.searchParams.set('city', CITY);
    history.replaceState(null, '', u.toString());
  } catch (e) {}
  resetCatalogData();
  applyCityUI();
  renderBr();
  renderLatest();
  renderGrid();
  renderCmp();
  loadSheet();
}

/* Init */
$('cA').innerHTML = $('cB').innerHTML = P.map(p => `<option value="${p.id}">${p.n}</option>`).join('');
$('cA').value = 'i18pm';
$('cB').value = 'i17p';
$('trM').innerHTML = TI.map(x => `<option>${x[0]}</option>`).join('');

$('citySel').onchange = e => switchCity(e.target.value);
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
  L = b.dataset.lang;
  try { localStorage.setItem('lang', L); } catch (e) {}
  applyLang();
});
$('cA').onchange = $('cB').onchange = renderCmp;
['trM', 'trB', 'trC'].forEach(id => $(id).onchange = trade);
$('calcPrice').oninput = calc;
$('askInst').onclick = () => wa(curCity().wa, `Рассрочка 0-0-12 (${t(CITY)}): ${calcSum()} ₸ / ${months} мес.`);

$('trForm').onsubmit = e => {
  e.preventDefault();
  const cityGen = CITY === 'astana' ? 'Астане' : CITY === 'oral' ? 'Уральске' : 'Атырау';
  wa(curCity().wa, [
    `Хочу рассчитать Trade-In в ${cityGen}`,
    `Модель: ${$('trM').value}`,
    `Аккумулятор: ${$('trB').selectedOptions[0].text}`,
    `Состояние: ${$('trC').value}`
  ].join('\n'));
};

$('months').onclick = e => {
  const b = e.target.closest('.mo-btn');
  if (!b) return;
  months = +b.dataset.m;
  document.querySelectorAll('#months .mo-btn').forEach(x => x.classList.toggle('on', x === b));
  calc();
};

$('q').oninput = e => { F.q = e.target.value.trim().toLowerCase(); renderGrid(); };

$('catSeg').onclick = e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  F.cat = b.dataset.cat;
  $('catSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderGrid();
};

$('simSeg').onclick = e => {
  const b = e.target.closest('[data-sim]');
  if (!b) return;
  F.esim = +b.dataset.sim;
  $('simSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderLatest();
  renderGrid();
  renderCmp();
};

$('sortBtn').onclick = () => {
  F.asc = !F.asc;
  $('sortBtn').classList.toggle('on', F.asc);
  renderGrid();
};

function selectDevice(dev) {
  F.dev = dev;
  F.cat = 'all';
  F.q = '';
  $('q').value = '';
  $('catSeg').querySelectorAll('button').forEach((x, idx) => x.classList.toggle('on', idx === 0));
  renderGrid();
}

$('catTabs').onclick = e => {
  const b = e.target.closest('[data-dev]');
  if (b) selectDevice(b.dataset.dev);
};

document.querySelectorAll('[data-jump]').forEach(b => {
  b.onclick = () => {
    selectDevice(b.dataset.jump);
    $('catalog').scrollIntoView({ behavior: 'smooth' });
  };
});

document.addEventListener('click', e => {
  const sc = e.target.closest('[data-setcity]');
  if (sc) { switchCity(sc.dataset.setcity); return; }

  const sw = e.target.closest('.sw[data-colp]');
  if (sw) {
    const pid = sw.dataset.colp;
    selCol[pid] = +sw.dataset.coli;
    syncProductUI(pid);
    return;
  }

  const m = e.target.closest('[data-p][data-i]');
  if (m) {
    const pid = m.dataset.p;
    sel[pid] = +m.dataset.i;
    syncProductUI(pid);
    return;
  }

  const ord = e.target.closest('[data-order]');
  if (ord) {
    const p = [...P, ...DEV].find(x => x.id === ord.dataset.order);
    if (p) wa(curCity().wa, orderMsg(p));
    return;
  }

  const wBtn = e.target.closest('[data-watch]');
  if (wBtn) {
    const w = DEV.find(x => x.id === wBtn.dataset.watch);
    if (w) wa(curCity().wa, `iMarket (${t(CITY)}): ${w.n} ${w.o[sel[w.id] || 0][0]}`);
    return;
  }

  const op = e.target.closest('[data-open]');
  if (op) { openBuyModal(op.dataset.open); return; }

  const ac = e.target.closest('[data-acc]');
  if (ac) { wa(curCity().wa, `iMarket (${t(CITY)}): ${t('adName')}`); return; }

  if (e.target === $('dlg')) $('dlg').close();
});

applyLang();

/* Google Sheets CSV loader */
function parseCSV(txt) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) {
      if (ch === '"') { if (txt[i + 1] === '"') { c += '"'; i++; } else q = false; }
      else c += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n') { r.push(c); rows.push(r); r = []; c = ''; }
    else if (ch !== '\r') c += ch;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  return rows;
}
const normM = x => String(x).toUpperCase().replace(/\s/g, '').replace('ТБ', 'TB').replace('ГБ', 'GB');
function cell(v) {
  v = String(v || '').trim().toLowerCase();
  if (!v) return null;
  if (['скоро', 'soon', 'жақында'].includes(v)) return -1;
  const n = parseInt(v.replace(/[.,]\d{1,2}(?!\d)/g, '').replace(/[^\d-]/g, ''), 10);
  return (!isNaN(n) && n >= 50000 && n <= 3000000) ? n : undefined;
}

async function loadSheet() {
  const sheetUrl = curCity().csv;
  try {
    const r = await fetch(sheetUrl + (sheetUrl.includes('?') ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) return;
    const rows = parseCSV(await r.text()).slice(1);
    let hit = 0;
    rows.forEach(x => {
      const name = (x[0] || '').trim().toLowerCase();
      if (name === 'adj') {
        const a = parseInt(String(x[2]).replace(/[^\d-]/g, ''), 10);
        ADJ = (!isNaN(a) && Math.abs(a) <= 100000) ? a : 0;
        hit++;
        return;
      }
      const p = [...P, ...DEV, ...ACC].find(m => m.n.toLowerCase() === name);
      if (!p) return;
      const o = p.o.find(m => normM(m[0]) === normM(x[1]));
      if (!o) return;
      [[1, 2], [2, 3]].forEach(([k, c]) => {
        const v = cell(x[c]);
        if (v !== undefined) o[k] = v;
      });
      hit++;
    });
    if (hit) { renderLatest(); renderGrid(); renderCmp(); }
  } catch (e) {}
}
loadSheet();
